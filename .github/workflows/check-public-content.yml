name: Check public contents

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  text-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check publication allowlist and local links
        run: python3 tools/check_public_content.py
